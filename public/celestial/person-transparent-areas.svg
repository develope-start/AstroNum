      <ellipse cx="82" cy="55" rx="19" ry="47" fill="url(#person)"/>
      <ellipse cx="50" cy="72" rx="34" ry="21" fill="url(#hand)"/>
      <ellipse cx="23" cy="58" rx="11" ry="10" fill="url(#finger)"/>
