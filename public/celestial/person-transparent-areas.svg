<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="person" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hand" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="finger" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <mask id="cutouts" mask-type="luminance">
